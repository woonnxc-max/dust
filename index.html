<!DOCTYPE html>
<!-- 한국어 웹 문서 선언 -->
<html lang="ko">
<head>
    <!-- 문자 인코딩 설정 (UTF-8) -->
    <meta charset="UTF-8">
    <!-- 모바일 환경 최적화 뷰포트 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 웹 애플리케이션 제목 -->
    <title>에어코리아 공기 신호등</title>
    <!-- 고품질 한글 웹폰트 Pretendard CDN 연결 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <!-- Chart.js 라이브러리 CDN 연결 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 반응형 스타일시트 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 전체 콘텐츠 래퍼 컨테이너 -->
    <div class="container">
        <!-- 상단 헤더 영역 -->
        <header class="header">
            <!-- 공기 신호등 메인 타이틀 -->
            <h1 class="title">🚦 우리 동네 공기 신호등</h1>
            <!-- 지역 선택 드롭다운 박스 -->
            <div class="control-box">
                <label for="sidoSelect" class="select-label">지역 선택</label>
                <!-- 18개 시·도 선택 메뉴 -->
                <select id="sidoSelect" class="sido-dropdown">
                    <option value="서울" selected>서울</option>
                    <option value="전국">전국</option>
                    <option value="부산">부산</option>
                    <option value="대구">대구</option>
                    <option value="인천">인천</option>
                    <option value="광주">광주</option>
                    <option value="대전">대전</option>
                    <option value="울산">울산</option>
                    <option value="세종">세종</option>
                    <option value="경기">경기</option>
                    <option value="강원">강원</option>
                    <option value="충북">충북</option>
                    <option value="충남">충남</option>
                    <option value="전북">전북</option>
                    <option value="전남">전남</option>
                    <option value="경북">경북</option>
                    <option value="경남">경남</option>
                    <option value="제주">제주</option>
                </select>
            </div>
        </header>

        <!-- 공기 신호등 대표 상태 대형 카드 -->
        <section id="trafficLightCard" class="traffic-light-card status-unknown">
            <!-- 상단 지역명 및 측정 기준 시각 -->
            <div class="traffic-header">
                <span class="region-pill" id="currentRegion">서울</span>
                <span id="baseTimeText" class="base-time">기준 시각 불러오는 중...</span>
            </div>

            <!-- 신호등 핵심 정보 (이모지 + 대표 상태 + 평균 수치) -->
            <div class="traffic-main">
                <!-- 상태별 대형 신호등 이모지 (🔵🟢🟠🔴) -->
                <div id="trafficEmoji" class="traffic-emoji">⏳</div>
                <div class="traffic-info-group">
                    <!-- 대표 대기질 등급 텍스트 (좋음 / 보통 / 나쁨 / 매우나쁨) -->
                    <div id="trafficStatus" class="traffic-status-text">불러오는 중...</div>
                    <!-- 평균 미세먼지 수치 표시 영역 -->
                    <div class="traffic-value-wrap">
                        <span class="avg-label">평균</span>
                        <span id="averagePm10" class="average-value">-</span>
                        <span class="unit">㎍/㎥</span>
                    </div>
                </div>
            </div>

            <!-- 하단 외출 안내 문구 (나쁨 이상 시 '외출 시 마스크를 챙기세요') -->
            <div class="traffic-guide-box">
                <p id="trafficGuide" class="traffic-guide">데이터를 불러오는 중입니다...</p>
            </div>
        </section>

        <!-- 상위 10개 측정소 미세먼지 가로 막대그래프 섹션 -->
        <section class="chart-section">
            <div class="chart-header">
                <h2 class="section-title">📊 미세먼지 높은 측정소 TOP 10</h2>
                <span class="chart-subtitle">(단위: ㎍/㎥)</span>
            </div>
            <!-- 차트 렌더링 영역 래퍼 -->
            <div class="chart-container">
                <!-- Chart.js 캔버스 요소 -->
                <canvas id="dustChart"></canvas>
            </div>
        </section>

        <!-- 측정소별 상세 카드 목록 컨테이너 -->
        <section class="stations-section">
            <h2 class="section-title">측정소별 실시간 대기질</h2>
            <main id="stationContainer" class="station-grid">
                <!-- 자바스크립트로 측정소별 카드가 동적으로 채워집니다 -->
            </main>
        </section>
    </div>

    <!-- 비즈니스 로직 스크립트 연결 -->
    <script src="script.js"></script>
</body>
</html>
